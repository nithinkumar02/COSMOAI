<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CosmoChat AI</title>
    <link rel="stylesheet" href="chatgpt.css">
</head>
<body>

    <!-- Intro Section (Slide Page) -->
    <div class="intro-screen" id="intro-screen">
        <canvas id="stars"></canvas> <!-- Moving Stars Animation -->
        <h1 class="intro-title">🚀 CosmoChat AI 🚀</h1>
        <button onclick="startChat()" class="start-btn">Start Chat</button>
    </div>

    <!-- Chat Section (Hidden Initially) -->
    <div class="chat-container" id="chat-container">
        <h1>CosmoChat AI</h1>
        <div class="chat-box" id="chat-box"></div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Ask me anything..." />
            <button onclick="sendMessage()">🚀 Send</button>
        </div>
    </div>

    <script src="chatgpt.js"></script>
    <script src="STARS.JS"></script> <!-- Star Animation -->
</body>
</html>
